<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Horários Gerados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light p-5">
    <div class="container">
      <h1 class="mb-4 text-primary">📅 Horários Gerados</h1>
      <div th:each="entry : ${horarios}">
        <h3 class="mt-4">Turma: <span th:text="${entry.key}"></span></h3>
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Horário</th>
              <th>Professor</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="horario : ${entry.value.entrySet()}">
              <td th:text="${horario.key}"></td>
              <td th:text="${horario.value}"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <a href="/" class="btn btn-secondary mt-4">⬅ Voltar</a>
    </div>
  </body>
</html>
