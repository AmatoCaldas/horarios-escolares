<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Gerador de Horários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(120deg, #e0f7fa, #ffffff);
      }
      .menu-card {
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        background-color: white;
      }
    </style>
  </head>
  <body>
    <div
      class="container py-5 d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="col-md-6 menu-card text-center">
        <h1 class="mb-4 text-primary">Gerador de Horários Escolares</h1>
        <div class="d-grid gap-3">
          <a href="/professores" class="btn btn-outline-primary btn-lg"
            >Cadastrar Professor</a
          >
          <a href="/turmas" class="btn btn-outline-success btn-lg"
            >Cadastrar Turma</a
          >
          <a href="/gerar" class="btn btn-primary btn-lg">Gerar Horários</a>
          <a href="/horarios" class="btn btn-dark btn-lg">Ver Horários</a>
        </div>
      </div>
    </div>
  </body>
</html>
