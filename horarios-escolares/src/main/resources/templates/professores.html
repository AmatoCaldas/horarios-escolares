<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Professores</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Cadastro de Professores</h1>
      <form
        method="post"
        action="/api/professores"
        class="card p-4 shadow-sm rounded-3 bg-white"
      >
        <div class="mb-3">
          <label for="nome" class="form-label">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="materia" class="form-label">Matéria:</label>
          <input
            type="text"
            id="materia"
            name="materia"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="maxAulas" class="form-label">Máximo de Aulas:</label>
          <input
            type="number"
            id="maxAulas"
            name="maxAulas"
            class="form-control"
            required
            min="1"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Disponibilidade:</label>
          <div class="row" id="disponibilidade-container"></div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Professor</button>
      </form>
    </div>
  </body>
  <div class="container">
    <div id="disponibilidade-container" class="row gy-4"></div>
  </div>

  <script>
    const diasDaSemana = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
    const horarios = {
      Manhã: ['08:00', '09:00', '10:00', '11:00'],
      Tarde: ['13:00', '14:00', '15:00', '16:00', '17:00'],
      Noite: ['18:00', '19:00', '20:00', '21:00'],
    };

    const container = document.getElementById('disponibilidade-container');

    diasDaSemana.forEach((dia, indexDia) => {
      const card = document.createElement('div');
      card.className = 'col-md-6';

      const cardContent = `
      <div class="card shadow-sm h-100">
        <div class="card-header bg-primary text-white fw-bold">
          ${dia}
        </div>
        <div class="card-body">
          ${Object.entries(horarios)
            .map(
              ([periodo, horas], i) => `
            <div class="mb-3">
              <h6 class="text-secondary">${periodo}</h6>
              <div class="row row-cols-2 row-cols-md-3 g-2">
                ${horas
                  .map(
                    (hora) => `
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" 
                      name="disponibilidade" 
                      value="${dia}-${hora}" 
                      id="${dia.toLowerCase()}-${hora.replace(':', '')}">
                    <label class="form-check-label" for="${dia.toLowerCase()}-${hora.replace(
                      ':',
                      ''
                    )}">
                      ${hora}
                    </label>
                  </div>
                `
                  )
                  .join('')}
              </div>
            </div>
          `
            )
            .join('')}
        </div>
      </div>
    `;

      card.innerHTML = cardContent;
      container.appendChild(card);
    });
  </script>
</html>
